name: Embedded PostgreSQL diagnostic
on: [push]
permissions:
  contents: read
jobs:
  native-probe:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install --only-binary=:all: pg0-embedded==0.16.1
      - run: python tools/hindsight-windows-probe.py
