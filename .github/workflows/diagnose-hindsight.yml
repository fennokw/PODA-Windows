name: Isolated Windows Hindsight smoke
on: [push]
permissions:
  contents: read
jobs:
  native-hindsight:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - run: |
          python -m pip install fastapi uvicorn httpx requests pydantic python-dateutil cryptography python-multipart numpy pytest pywin32 tzdata
      - name: Run the Windows Hindsight store-and-recall test
        shell: pwsh
        env:
          PODA_TEST_NATIVE_HINDSIGHT: '1'
        run: |
          python -m pytest -q --basetemp (Join-Path $env:RUNNER_TEMP 'poda-hindsight-pytest') tests/test_managed_addons.py -k native_hindsight
