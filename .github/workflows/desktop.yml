name: PODA Desktop for Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Package the x64 app
        shell: pwsh
        working-directory: desktop
        run: |
          python ../tools/release_guard.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PODA_DATA_DIR = Join-Path $env:RUNNER_TEMP 'poda-ci'
          & ../Install-PODA.cmd -NoLaunch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bundle = '../dist/desktop/PODA-win32-x64'
          foreach ($file in @('PODA.exe', 'resources/app.asar', 'resources/backend/Setup-PODA.cmd', 'resources/backend/setup-windows.ps1')) {
            if (-not (Test-Path (Join-Path $bundle $file) -PathType Leaf)) { throw "Missing $file" }
          }
          $env:PODA_TEST_BACKEND = (Resolve-Path (Join-Path $bundle 'resources/backend')).Path
          $desktopPath = [Environment]::GetFolderPath('DesktopDirectory', 'DoNotVerify')
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $shell.CreateShortcut((Join-Path $desktopPath 'PODA.lnk'))
          if ($shortcut.TargetPath -ne (Resolve-Path (Join-Path $bundle 'PODA.exe')).Path) {
            throw 'The PODA desktop shortcut does not target the installed executable.'
          }
          $runtime = Get-ChildItem (Join-Path $env:PODA_DATA_DIR 'desktop-runtime') -Directory | Select-Object -First 1
          & (Join-Path $runtime.FullName 'Scripts/python.exe') -m pytest -q --basetemp (Join-Path $env:RUNNER_TEMP 'poda-pytest') test_backend.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $log = Join-Path $env:PODA_DATA_DIR 'logs/desktop-server.log'
          $desktop = Start-Process -FilePath (Join-Path $bundle 'PODA.exe') -PassThru
          try {
            $ready = $false
            $deadline = (Get-Date).AddSeconds(55)
            while ((Get-Date) -lt $deadline -and -not $desktop.HasExited) {
              if ((Test-Path $log) -and (Select-String -LiteralPath $log -Pattern 'Application startup complete' -Quiet)) {
                $ready = $true
                break
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) {
              if (Test-Path $log) { Get-Content -LiteralPath $log }
              throw 'PODA.exe did not start its encrypted backend.'
            }
          }
          finally {
            if (-not $desktop.HasExited -and (-not $desktop.CloseMainWindow() -or -not $desktop.WaitForExit(16000))) {
              Stop-Process -Id $desktop.Id -Force -ErrorAction SilentlyContinue
            }
          }
          Compress-Archive -Path $bundle -DestinationPath ../dist/PODA-Windows-x64.zip
      - uses: actions/upload-artifact@v6
        with:
          name: PODA-Windows-x64
          path: dist/PODA-Windows-x64.zip
          if-no-files-found: error
